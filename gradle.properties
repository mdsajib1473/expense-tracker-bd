# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (required for Compose and Room).
android.useAndroidX=true

# Generate namespaced R classes only, keeps builds faster.
android.nonTransitiveRClass=true

# Kotlin official code style.
kotlin.code.style=official

# Reuse the configuration phase across builds when nothing affecting it changed.
# Speeds up repeat builds noticeably. WARN (not FAIL) so a plugin that is not
# yet configuration-cache compatible degrades to a cache miss instead of
# failing the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
