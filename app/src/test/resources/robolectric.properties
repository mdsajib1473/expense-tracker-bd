# Robolectric cannot simulate the app's real targetSdk here, for two reasons:
# its 4.16.x line supports simulated SDK levels only up to 36 (the app
# targets 37), and the SDK 36 android-all jar requires a Java 21 runtime
# while CI runs the unit tests on JDK 17 (.github/workflows/ci.yml). A local
# machine may run Gradle on a newer JDK, but the tests must pass on the
# oldest one in use. The code itself compiles to Java 17 bytecode with any
# JDK from 17 up. SDK 35 is the newest level that runs
# on Java 17, and nothing in the DAO tests depends on SDK-level behavior.
# Raise this once CI moves to JDK 21 or newer and a Robolectric release
# supports SDK 37.
sdk=35
